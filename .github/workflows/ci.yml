name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests, Python ${{ matrix.python }} (SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -rs
      - name: Three travellers, three plans
        run: python -m liming demo

  postgres:
    name: Tests on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liming
          POSTGRES_PASSWORD: liming
          POSTGRES_DB: liming_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U liming" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIMING_TEST_DATABASE_URL: postgresql+psycopg://liming:liming@localhost:5432/liming_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -rs
      - name: Build the demo database with the migrations
        run: python -m liming init-demo --db "$LIMING_TEST_DATABASE_URL" --reset

  frontend:
    name: Front end (TypeScript, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The TypeScript API types match frontend/openapi.json
        run: npm run api-types && git diff --exit-code -- src/api-types.ts
      - name: The committed build matches the source
        run: npm run build && git diff --exit-code -- ../liming/web

  browser:
    name: Browser test (Chromium)
    runs-on: ubuntu-latest
    env:
      LIMING_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_frontend.py -rs
